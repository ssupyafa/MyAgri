<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="../../static/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta charset="utf-8" />
    <title>Digital-Agriculture - Profile</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link rel="stylesheet" href="../static/dashboard/style.css">
    <link rel="stylesheet" href="../static/dark-mode.css">
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
    <script
        type="text/javascript">WebFont.load({ google: { families: ["Montserrat:100,100italic,200,200italic,300,300italic,400,400italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic", "Droid Serif:400,400italic,700,700italic", "Poppins:regular"] } });</script>
    <script
        type="text/javascript">!function (o, c) { var n = c.documentElement, t = " w-mod-"; n.className += t + "js", ("ontouchstart" in o || o.DocumentTouch && c instanceof DocumentTouch) && (n.className += t + "touch") }(window, document);</script>
</head>

<body class="body-3">
    <section id="navbar" class="section-84">
        <div class="text-block-39">Digital Agriculture<span class="text-span-11">Crop</span></div>
        <section class="section-87">
            <a href="/" class="link-27"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/suitability" class="link-27"><i class="fa-solid fa-list"></i> Soil Suitability</a>
            <a href="/crop_disease" class="link-27"><i class="fa-solid fa-list"></i> Crop Disease</a>
            <a href="/drought" class="link-27"><i class="fa-solid fa-sun"></i> Drought Prediction</a>
            <a href="/crop_recommendation" class="link-27"><i class="fa-solid fa-tree"></i> Crop Recommendation</a>
            <a href="/profile" class="link-27" id="active"><i class="fa-solid fa-user"></i> Profile</a>

        </section>
    </section>
    <section class="section-85" id="main">
        <section class="section-86">
            <div class="text-block-38">Profile</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="theme-switch-wrapper" style="position: relative; top: 0; right: 0; display: inline-flex;">
                    <label class="theme-switch" for="dark-mode-checkbox">
                        <input type="checkbox" id="dark-mode-checkbox" />
                        <div class="slider round"></div>
                    </label>
                </div>
                <a href="/logout" class="link-25">Log out</a>
            </div>
        </section>
        <section class="section-88">
            <div class="w-form" id="updateform">
                <div class="text-block-42">Update Your Profile<div><br>
                        <form id="wf-form-Signup-form" name="wf-form-Signup-form" data-name="Signup form"
                            action="/dashboard/profile" method="post" data-wf-page-id="661a6822f533866984ed146f"
                            data-wf-element-id="e9e3754b-0c47-93dc-4103-94639df8bdcc">
                            <section class="section-83">
                                <section>
                                    <div class="text-block-36" style="font-size: 16px !important;">First name</div>
                                    <input class="text-field-2 w-input" maxlength="256" name="first" data-name="first"
                                        placeholder="" type="text" id="first" value="{{first}}" />
                                </section>
                                <section>
                                    <div class="text-block-36" style="font-size: 16px !important;">Last name</div><input
                                        class="text-field-2 w-input" maxlength="256" name="last" data-name="last"
                                        placeholder="" type="text" id="last" value="{{last}}" />
                                </section>
                            </section>
                            <div class="text-block-37" style="font-size: 16px !important;">Email address</div><input
                                class="text-field-2 w-input" maxlength="256" name="email" data-name="first"
                                placeholder="" type="email" id="first" value="{{email}}" />
                            <div class="text-block-37" style="font-size: 16px !important;">Username</div><input
                                class="text-field-2 w-input" maxlength="256" data-name="first" placeholder=""
                                type="text" disabled="true" id="first" value="{{username}}" /><br>
                            <input type="submit" style="font-size: 16px !important;" data-wait="Please wait..."
                                class="submit-button-2 w-button" value="Update" /><br>
                            {% if status %}
                            <div class="w-form-fail" style="display: block;">
                                <p style="color: red; font-size: 16px !important;">Invalid Input</p>
                            </div>
                            {% endif %}
                        </form>
                        </p>
                    </div>
        </section>
    </section>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=661a6822f533866984ed140f"
        type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
        crossorigin="anonymous"></script>
    <script src="https://cdn.prod.website-files.com/661a6822f533866984ed140f/js/webflow.schunk.d97efad01808426c.js"
        type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/661a6822f533866984ed140f/js/webflow.a9ba356d.d790faab5eca85f2.js"
        type="text/javascript"></script>
    <script src="../static/dark-mode.js"></script>
</body>

</html>
